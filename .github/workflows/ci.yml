name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      PLANBRIDGE_HOME: ${{ runner.temp }}/pb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit + integration tests (fake Claude Code CLI)
        run: npm test
      - name: CLI works end to end (fake Claude Code CLI)
        shell: bash
        env:
          CLAUDE_BIN: ${{ github.workspace }}/test/fixtures/fake-claude.mjs
        run: |
          node bin/planbridge.js --help
          node bin/planbridge.js doctor --deep
          node bin/planbridge.js key | grep -q '^pb-'
