<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanBridge Playground</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1b18; --muted:#6f6a62; --line:#e4e0d8; --accent:#c96442; --user:#efe9df; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191817; --panel:#222120; --ink:#ece9e3; --muted:#a29d94; --line:#353330; --accent:#e07a56; --user:#2d2b28; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { letter-spacing:.2px; }
  header b span { color:var(--accent); }
  input, select, button, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:14px; }
  #log { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:14px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; max-width:100%; }
  .user { background:var(--user); align-self:flex-end; max-width:85%; }
  .assistant { background:var(--panel); border:1px solid var(--line); }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  .err { color:#c0392b; }
  .msg img { max-width:180px; border-radius:8px; display:block; margin-top:6px; }
  .usage { margin-right:auto; position:relative; width:150px; height:20px; border:1px solid var(--line); border-radius:99px; overflow:hidden; font-size:11px; }
  .usage:empty { visibility:hidden; }
  .usage i { position:absolute; inset:0 auto 0 0; background:var(--accent); opacity:.25; }
  .usage em { position:relative; font-style:normal; display:block; text-align:center; line-height:18px; color:var(--muted); }
  .empty { margin:auto; text-align:center; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); max-width:820px; width:100%; margin:0 auto; align-items:flex-end; }
  textarea { flex:1; resize:none; min-height:44px; max-height:200px; }
  #files { font-size:12px; color:var(--muted); padding:0 16px; max-width:820px; width:100%; margin:0 auto; }
  @media (max-width:600px) { header input#key { width:100%; order:9; } }
</style>
</head>
<body>
<header>
  <b>Plan<span>Bridge</span></b>
  <span id="usage" class="usage" title="Plan usage (5-hour window)"></span>
  <input id="key" type="password" placeholder="API key  (run: planbridge key)" size="28">
  <select id="model"><option>sonnet</option><option>opus</option><option>haiku</option><option>fable</option></select>
  <select id="effort" title="Reasoning effort"><option value="">effort: auto</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select>
  <label class="chk"><input type="checkbox" id="useSession" checked> memory</label>
  <button id="newChat" type="button">New chat</button>
</header>
<div id="log"><div class="empty">Say something. You can attach images, PDFs or text files.<br><small>Powered by your own Claude Code login — nothing leaves your machine except the request to Anthropic.</small></div></div>
<div id="files"></div>
<form id="f">
  <button type="button" id="attach" title="Attach">📎</button>
  <input type="file" id="file" multiple hidden accept="image/*,application/pdf,text/*,.md,.json,.csv">
  <textarea id="input" placeholder="Message…  (Enter to send, Shift+Enter for a new line)"></textarea>
  <button class="primary" id="send">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
async function refreshUsage() {
  try {
    const r = await fetch('/v1/limits', { headers: { Authorization: 'Bearer ' + $('key').value.trim() } });
    const w = (await r.json()).rate_limit?.unifiedWindows?.five_hour;
    if (!w) return;
    const pct = Math.round(w.utilization * 100);
    $('usage').innerHTML = `<i style="width:${pct}%"></i><em>${pct}% of 5h limit</em>`;
  } catch {}
}
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
$('key').value = store.get('pb_key') || '';
$('key').onchange = () => { store.set('pb_key', $('key').value.trim()); refreshUsage(); };

let messages = [];      // history (stateless mode)
let sessionId = null;   // conversation id (memory mode)
let pending = [];       // attachments

$('newChat').onclick = () => { messages = []; sessionId = null; $('log').innerHTML = '<div class="empty">New chat.</div>'; };
$('attach').onclick = () => $('file').click();
$('file').onchange = async () => {
  for (const f of $('file').files) {
    const url = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    pending.push({ name: f.name, type: f.type, url });
  }
  $('file').value = '';
  $('files').textContent = pending.length ? '📎 ' + pending.map((p) => p.name).join(', ') : '';
};
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } });

function bubble(role, text = '') {
  $('log').querySelector('.empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = 1e9;
  return d;
}

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text && !pending.length) return;
  const key = $('key').value.trim();
  if (!key) { alert('Paste your API key first — run `planbridge key` in a terminal.'); return; }

  const content = [];
  if (text) content.push({ type: 'text', text });
  for (const p of pending) {
    content.push(p.type.startsWith('image/')
      ? { type: 'image_url', image_url: { url: p.url } }
      : { type: 'file', file: { filename: p.name, file_data: p.url } });
  }
  const u = bubble('user', text);
  for (const p of pending) if (p.type.startsWith('image/')) { const i = new Image(); i.src = p.url; u.appendChild(i); } else u.append('\n📄 ' + p.name);
  pending = []; $('files').textContent = ''; $('input').value = '';

  const userMsg = { role: 'user', content };
  const useSession = $('useSession').checked;
  const body = {
    model: $('model').value,
    stream: true,
    stream_options: { include_usage: true },
    messages: useSession ? [userMsg] : [...messages, userMsg],
  };
  if ($('effort').value) body.reasoning_effort = $('effort').value;
  if (useSession) { if (sessionId) body.session_id = sessionId; else body.session = true; }

  const a = bubble('assistant', '…');
  $('send').disabled = true;
  const t0 = performance.now();
  let out = '', usage = null, model = '';
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).error?.message || r.statusText);
    sessionId = r.headers.get('X-Session-Id') || sessionId;
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        const j = JSON.parse(line.slice(6));
        if (j.error) throw new Error(j.error.message);
        if (j.session_id) sessionId = j.session_id;
        model = j.model || model;
        if (j.usage) usage = j.usage;
        const d = j.choices?.[0]?.delta?.content;
        if (d) { out += d; a.textContent = out; $('log').scrollTop = 1e9; }
      }
    }
    messages.push(userMsg, { role: 'assistant', content: out });
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = `${model} · ${((performance.now() - t0) / 1000).toFixed(1)}s` +
      (usage ? ` · ${usage.prompt_tokens}→${usage.completion_tokens} tokens` + (usage.completion_tokens_details?.reasoning_tokens ? ` (${usage.completion_tokens_details.reasoning_tokens} thinking)` : '') : '') +
      (useSession && sessionId ? ` · ${sessionId}` : '');
    a.appendChild(m);
    refreshUsage();
  } catch (err) {
    a.textContent = 'Error: ' + err.message; a.classList.add('err');
  } finally { $('send').disabled = false; $('input').focus(); }
};
if ($('key').value) refreshUsage();
</script>
</body>
</html>
